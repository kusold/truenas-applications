services:
  webdav:
    # Same engine as the TrueNAS community webdav catalog app (which runs the
    # official httpd image): Apache with mod_dav. Pinned by digest; Renovate
    # keeps the tag and digest current.
    image: httpd:2.4.69@sha256:d3accb516506c05ae0068bb54ba6798a10b249b64db91268fca692326cb02b4b
    container_name: webdav
    hostname: webdav
    restart: unless-stopped
    # TrueNAS apps convention (the catalog app documents uid/gid 568/568 and
    # accepts any non-root user). httpd needs no root here: the port is >1024
    # and the pid/DavLock files live on the tmpfs below. Change this together
    # with the ownership of the served share.
    user: "568:568"
    ports:
      - "30035:30035"
    volumes:
      # Existing host path served over WebDAV; not managed by the deployer.
      - "${WEBDAV_SHARE_PATH:?set WEBDAV_SHARE_PATH in webdav/.env}:/shares/share1"
      # htpasswd directory (contains webdavhtbasic, created by the operator;
      # see README). Deployer-managed dataset (WEBDAV_CONFIG_DATASET comes
      # from .truenas-generated.env). Mounted as a directory rather than the
      # single file so Docker cannot turn a missing file into a directory.
      - "${WEBDAV_CONFIG_DATASET}:/etc/apache2/auth:ro"
    tmpfs:
      # PidFile and DavLockDB must be writable by the non-root user; the
      # image-owned /usr/local/apache2 tree is not. Same tmpfs the catalog
      # app uses.
      - /usr/local/apache2/var:size=100m,mode=0777
    configs:
      # Full replacement httpd.conf and the WebDAV vhost, flattened from the
      # TrueNAS catalog webdav app 1.3.9 templates (see README). Inline
      # configs, exactly how the catalog app itself ships them.
      - source: httpd-conf
        target: /usr/local/apache2/conf/httpd.conf
      - source: webdav-http-conf
        target: /usr/local/apache2/conf/Includes/webdav-http.conf
    healthcheck:
      # Raw TCP probe: the image ships no curl/wget/nc, and an HTTP probe
      # would fail behind basic auth. Same check the catalog app uses.
      test: ["CMD", "timeout", "1", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/30035"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 2s

configs:
  httpd-conf:
    # Flattened from truenas/apps ix-dev/community/webdav 1.3.9,
    # templates/webdav_macros/httpd.conf. httpd runs as a non-root user, so
    # there are no User/Group directives, and the pid file lives on the
    # tmpfs at /usr/local/apache2/var.
    content: |
      PidFile "/usr/local/apache2/var/httpd.pid"
      LoadModule authn_file_module /usr/local/apache2/modules/mod_authn_file.so
      LoadModule authn_core_module /usr/local/apache2/modules/mod_authn_core.so
      LoadModule authz_user_module /usr/local/apache2/modules/mod_authz_user.so
      LoadModule authz_core_module /usr/local/apache2/modules/mod_authz_core.so
      LoadModule alias_module /usr/local/apache2/modules/mod_alias.so
      LoadModule mpm_event_module /usr/local/apache2/modules/mod_mpm_event.so
      LoadModule auth_basic_module /usr/local/apache2/modules/mod_auth_basic.so
      LoadModule auth_digest_module /usr/local/apache2/modules/mod_auth_digest.so
      LoadModule setenvif_module /usr/local/apache2/modules/mod_setenvif.so
      LoadModule dav_module /usr/local/apache2/modules/mod_dav.so
      LoadModule dav_fs_module /usr/local/apache2/modules/mod_dav_fs.so
      LoadModule allowmethods_module /usr/local/apache2/modules/mod_allowmethods.so
      LoadModule ssl_module /usr/local/apache2/modules/mod_ssl.so
      LoadModule socache_shmcb_module /usr/local/apache2/modules/mod_socache_shmcb.so
      LoadModule unixd_module /usr/local/apache2/modules/mod_unixd.so
      LoadModule rewrite_module /usr/local/apache2/modules/mod_rewrite.so

      # HTTP/2 module
      LoadModule http2_module /usr/local/apache2/modules/mod_http2.so

      # Auth caching module
      LoadModule authn_socache_module /usr/local/apache2/modules/mod_authn_socache.so

      LoadModule authz_host_module /usr/local/apache2/modules/mod_authz_host.so
      LoadModule authz_groupfile_module /usr/local/apache2/modules/mod_authz_groupfile.so
      LoadModule access_compat_module /usr/local/apache2/modules/mod_access_compat.so
      LoadModule reqtimeout_module /usr/local/apache2/modules/mod_reqtimeout.so
      LoadModule filter_module /usr/local/apache2/modules/mod_filter.so
      LoadModule mime_module /usr/local/apache2/modules/mod_mime.so
      LoadModule env_module /usr/local/apache2/modules/mod_env.so
      LoadModule headers_module /usr/local/apache2/modules/mod_headers.so
      LoadModule status_module /usr/local/apache2/modules/mod_status.so
      LoadModule autoindex_module /usr/local/apache2/modules/mod_autoindex.so
      LoadModule dir_module /usr/local/apache2/modules/mod_dir.so
      ServerName localhost

      <IfModule dir_module>
        DirectoryIndex disabled
      </IfModule>

      <Files ".ht*">
        Require all denied
      </Files>

      ErrorLog "/proc/self/fd/2"
      LogLevel warn

      <IfModule log_config_module>
        LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
        LogFormat "%h %l %u %t \"%r\" %>s %b" common

        <IfModule logio_module>
          LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O" combinedio
        </IfModule>

        CustomLog "/proc/self/fd/1" common
      </IfModule>

      <IfModule alias_module>
        ScriptAlias /cgi-bin/ "/usr/local/apache2/cgi-bin/"
      </IfModule>

      <IfModule mime_module>
        TypesConfig /usr/local/apache2/conf/mime.types

        AddType application/x-compress .Z
        AddType application/x-gzip .gz .tgz
      </IfModule>

      <IfModule ssl_module>
        SSLRandomSeed startup builtin
        SSLRandomSeed connect builtin
        SSLProtocol +TLSv1.2 +TLSv1.3
      </IfModule>

      <IfModule authn_socache_module>
        AuthnCacheSOCache shmcb
      </IfModule>

      Include /usr/local/apache2/conf/Includes/*.conf
  webdav-http-conf:
    # Flattened from truenas/apps ix-dev/community/webdav 1.3.9,
    # templates/webdav_macros/webdav_http.conf + webdav_core.conf with
    # auth_type=basic and a single share resolved statically.
    content: |
      Listen 30035
      <VirtualHost *:30035>
        DavLockDB "/usr/local/apache2/var/DavLock"
        <Directory "/">
          # Basic auth (the catalog app's "basic" auth_type). The htpasswd
          # file is webdavhtbasic inside the deployer-managed dataset mounted
          # at /etc/apache2/auth. To serve anonymously instead (the catalog
          # app's default "none"), delete the Auth* and Require lines below.
          AuthType Basic
          AuthName webdav
          AuthBasicProvider socache file
          AuthnCacheProvideFor file
          AuthnCacheTimeout 300
          AuthUserFile /etc/apache2/auth/webdavhtbasic
          Require valid-user
          Dav On
          IndexOptions Charset=utf-8
          AddDefaultCharset UTF-8
          AllowOverride None
          Order allow,deny
          Allow from all
          Options Indexes FollowSymLinks
        </Directory>

        # WEBDAV_SHARE_PATH (webdav/.env) is mounted at /shares/share1 and
        # served at http://<host>:30035/. The catalog app served each share
        # under /<share-name> instead; to keep an old client URL such as
        # http://<host>:30035/myshare working, add an Alias with the old
        # share name, for example:
        # Alias /myshare "/shares/share1"
        DocumentRoot "/shares/share1"
        <Directory "/shares/share1">
          # 1 GiB request body limit, the catalog default. Set 0 for
          # unlimited (needed for larger uploads).
          LimitRequestBody 1073741824
        </Directory>

        # To make the share read-only (the catalog app's "Read Only" share
        # option), uncomment:
        # <Location "/">
        #   AllowMethods GET OPTIONS PROPFIND
        # </Location>

        # The following directives disable redirects on non-GET requests for
        # a directory that does not include the trailing slash. This fixes a
        # problem with several clients that do not appropriately handle
        # redirects for folders with DAV methods.
        BrowserMatch "Microsoft Data Access Internet Publishing Provider" redirect-carefully
        BrowserMatch "MS FrontPage" redirect-carefully
        BrowserMatch "^WebDrive" redirect-carefully
        BrowserMatch "^WebDAVFS/1.[01234]" redirect-carefully
        BrowserMatch "^gnome-vfs/1.0" redirect-carefully
        BrowserMatch "^XML Spy" redirect-carefully
        BrowserMatch "^Dreamweaver-WebDAV-SCM1" redirect-carefully
        BrowserMatch "^DAVx5" redirect-carefully
        BrowserMatch " Konqueror/4" redirect-carefully

        RequestReadTimeout handshake=0 header=20-40,MinRate=500 body=20,MinRate=500
      </VirtualHost>

app:
  name: "webdav"
  enabled: true
  compose: "compose.yaml"
  env_file: ".env"

icon:
  # The TrueNAS catalog app icon. The URL ends in .png but the bytes served
  # are JPEG, hence image/jpeg.
  media_type: "image/jpeg"
  base64: ""

datasets:
  - dataset: "tank/red/Applications/webdav"
    compose_env: "WEBDAV_CONFIG_DATASET"

portal:
  name: "Web UI"
  port: 30035
  scheme: "http"
  path: "/"

notes: |
  WebDAV (Apache httpd with mod_dav - the same image the TrueNAS community
  webdav catalog app runs). Serves the host path WEBDAV_SHARE_PATH
  (webdav/.env) on port 30035 with basic auth. The htpasswd file lives at
  tank/red/Applications/webdav/webdavhtbasic - create it before first start
  (see the README). The share is served at http://<host>:30035/; old catalog
  URLs of the form /<share-name> need the Alias line in compose.yaml.

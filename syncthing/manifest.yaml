app:
  name: "syncthing"
  enabled: true
  compose: "compose.yaml"
  env_file: ".env"

icon:
  media_type: "image/svg+xml"
  base64: ""

datasets:
  - dataset: "tank/red/Applications/syncthing"
    compose_env: "SYNCTHING_DATASET"

portal:
  name: "Web UI"
  port: 8384
  scheme: "http"
  path: "/"

notes: |
  Syncthing config, device keys, database, and the default Sync folder are under
  tank/red/Applications/syncthing (backup-worthy tree). Folders that sync other
  host paths are mounted below /data via SYNCTHING_DATA_PATH in the app .env.
  GUI is on port 8384; sync is 22000/tcp+udp; local discovery is 21027/udp.
  In-container upgrades are disabled (STNOUPGRADE); image updates arrive via
  Renovate digest bumps and the cron deployer.

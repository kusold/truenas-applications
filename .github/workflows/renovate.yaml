name: Renovate

on:
  schedule:
    # Every 6 hours at an off-minute. Exact timing is unimportant because
    # minimumReleaseAge in renovate.json holds new releases for 3 days.
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: "Renovate log level"
        default: info
        type: choice
        options:
          - info
          - debug

# The default GITHUB_TOKEN is not used; Renovate authenticates with
# RENOVATE_TOKEN, so it needs no grants.
permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    # Keep pinned; bump manually when needed. Renovate talks to the GitHub API
    # directly, so no checkout step is required.
    container: ghcr.io/renovatebot/renovate:44.39.2
    steps:
      - name: Renovate
        run: renovate
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}

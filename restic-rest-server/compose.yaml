services:
  restic-rest-server:
    image: restic/rest-server:0.14.0@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
    container_name: restic-rest-server
    hostname: restic-rest-server
    # Match the TrueNAS catalog app (and the ix-apps files it leaves behind,
    # owned by apps:apps). Both mounted datasets must be owned by 568:568.
    user: "568:568"
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATA_DIRECTORY: /data
      # bcrypt htpasswd lives in the Applications dataset, outside the backup
      # payload tree — the TrueNAS catalog app likewise kept /auth/htpasswd
      # out of /data. Create users with:
      #   docker exec -it restic-rest-server create_user <name>
      PASSWORD_FILE: /config/.htpasswd
      # One repository per user at /data/<username>; clients use
      # rest:http://<user>:<pass>@<host>:8000/<user>/. See README for other
      # flags (--append-only, --group-accessible-repos, --tls, --prometheus).
      OPTIONS: "--private-repos"
    volumes:
      # restic repositories (backup payload)
      - ${RESTIC_REST_DATA_DATASET}:/data
      # .htpasswd and future operator config
      - ${RESTIC_REST_CONFIG_DATASET}:/config
    healthcheck:
      # 0.14.0 has no unauthenticated HTTP endpoint: GET / answers 401 once
      # auth is on, and /healthz only ships after 0.14.0. Use the process
      # check the TrueNAS catalog app used; switch to an HTTP probe against
      # /healthz once an image newer than 0.14.0 is pinned.
      test: ["CMD-SHELL", "pgrep rest-server"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

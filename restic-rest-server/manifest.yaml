app:
  name: "restic-rest-server"
  enabled: true
  compose: "compose.yaml"
  env_file: ".env"

icon:
  media_type: "image/png"
  base64: ""

datasets:
  - dataset: "tank/red/Applications/restic-rest-server"
    compose_env: "RESTIC_REST_CONFIG_DATASET"
  - dataset: "tank/red/Backups/restic-rest-server"
    compose_env: "RESTIC_REST_DATA_DATASET"

notes: |
  Restic REST server exposing restic repositories to remote clients over
  plain HTTP on port 8000. Repositories (backup payload) live in
  tank/red/Backups/restic-rest-server mounted at /data; the bcrypt
  .htpasswd lives in tank/red/Applications/restic-rest-server mounted at
  /config. Manage users with: docker exec -it restic-rest-server
  create_user <name>. Runs as 568:568; both datasets must be owned by
  that user. --private-repos is enabled: each user's repository is
  /data/<username> and clients use
  rest:http://<user>:<pass>@<host>:8000/<user>/. No portal: the server has
  no real UI (GET / returns 401 without credentials).

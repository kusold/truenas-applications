services:
  versitygw:
    image: versity/versitygw:v1.7.0@sha256:c4cbd9d9cb8dedbb055ac788dbd02635651b9b1cebac95b095b3217231aa87ad
    container_name: versitygw
    hostname: versitygw
    restart: unless-stopped
    ports:
      # S3 API
      - "7070:7070"
      # Web UI
      - "7071:7071"
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      VGW_VERSIONING_DIR: "/versioning"
      VGW_PORT: ":7070"
      VGW_WEBUI_PORT: ":7071"
      VGW_REGION: "us-east-1"
      # Internal IAM account store. Enables multi-tenant mode (see README):
      # root plus admin/user/userplus accounts in users.json, and the Web UI
      # admin dashboard. Root is still defined by the env vars below; every
      # other account lives in the mounted dataset.
      VGW_IAM_DIR: "/iam"
      # S3 endpoint handed to the Web UI for the browser to call. Without this
      # the gateway auto-detects URLs from its own interfaces, which inside the
      # container are Docker bridge IPs (172.x) that LAN browsers cannot route
      # to; the UI then fails with "Network error: cannot reach gateway".
      # This URL is only parsed, never fetched, by the gateway itself, so the
      # mDNS hostname is fine here.
      VGW_WEBUI_GATEWAYS: "http://truenas.local:7070"
      ROOT_ACCESS_KEY: "${ROOT_ACCESS_KEY:?set ROOT_ACCESS_KEY in versitygw/.env}"
      ROOT_SECRET_KEY: "${ROOT_SECRET_KEY:?set ROOT_SECRET_KEY in versitygw/.env}"
    volumes:
      # Existing host path served over S3; not managed by the deployer.
      - "${VGW_DATA_PATH:?set VGW_DATA_PATH in versitygw/.env}:/data"
      # Previous object versions. Must be outside the data path: the gateway
      # refuses to start if the versioning dir is inside the gateway root.
      # Keep it on the same ZFS dataset as the data path so version copies
      # use the kernel copy path instead of falling back to a slower copy.
      - "${VGW_VERSIONING_PATH:?set VGW_VERSIONING_PATH in versitygw/.env}:/versioning"
      # IAM accounts (users.json + users.json.backup) for multi-tenant mode.
      # Deployer-managed dataset (VGW_IAM_DATASET in .truenas-generated.env).
      # Plain text JSON including secret keys; the gateway writes it 0600 and
      # the dataset sits under the backed-up Applications tree.
      - "${VGW_IAM_DATASET}:/iam"
    healthcheck:
      # GET / on the Web UI port serves index.html without auth (200).
      # The S3 port rejects unauthenticated requests, so it cannot be probed
      # with busybox wget directly.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7071/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

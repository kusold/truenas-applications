app:
  name: "silo"
  enabled: true
  compose: "compose.yaml"
  env_file: ".env"

icon:
  media_type: "image/svg+xml"
  base64: ""

datasets:
  - dataset: "tank/red/Applications/silo"
    compose_env: "SILO_DATASET"

portal:
  name: "Web UI"
  port: 9002
  scheme: "http"
  path: "/"

notes: |
  S3-compatible object storage (Silo, the maintained MinIO fork). S3 API on
  port 9000, web console (portal) on port 9002. Root credentials are
  MINIO_ROOT_USER / MINIO_ROOT_PASSWORD in silo/.env on the TrueNAS host.
  Buckets and .minio.sys live under tank/red/Applications/silo/export.

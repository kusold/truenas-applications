app:
  name: "minio"
  enabled: true
  compose: "compose.yaml"
  env_file: ".env"

icon:
  media_type: "image/png"
  base64: ""

datasets:
  - dataset: "tank/red/Applications/minio"
    compose_env: "MINIO_DATASET"

portal:
  name: "Web UI"
  port: 9002
  scheme: "http"
  path: "/"

notes: |
  S3-compatible object storage migrated from the official TrueNAS app.
  S3 API on port 9000, web console (portal) on port 9002. Root credentials
  are MINIO_ROOT_USER / MINIO_ROOT_PASSWORD in minio/.env on the TrueNAS
  host. Buckets and .minio.sys live under tank/red/Applications/minio/export.

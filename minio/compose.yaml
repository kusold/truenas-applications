services:
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: minio
    hostname: minio
    restart: unless-stopped
    # Matches the ownership of tank/red/Applications/minio/export left by the
    # official TrueNAS MinIO app; 568 is the TrueNAS apps group.
    user: "473:473"
    group_add:
      - "568"
    command:
      - server
      - --console-address
      - ":9002"
      - --address
      - ":9000"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in minio/.env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in minio/.env}"
      MINIO_VOLUMES: /export
      # Alias for the healthcheck below; "mc ready" needs no credentials.
      MC_HOST_health: "http://localhost:9000"
      TZ: Etc/UTC
    ports:
      # S3 API
      - "9000:9000"
      # Web console (portal)
      - "9002:9002"
    volumes:
      # Deployer-managed dataset (MINIO_DATASET in .truenas-generated.env).
      # Buckets and the .minio.sys metadata tree live in export/, carried
      # over from the official TrueNAS app.
      - "${MINIO_DATASET}/export:/export"
    healthcheck:
      test: ["CMD", "mc", "ready", "--insecure", "--cluster-read", "health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
